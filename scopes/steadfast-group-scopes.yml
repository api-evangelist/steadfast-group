note: >-
  Scopes are read from the anonymously-published OpenID Connect discovery document of Steadfast
  Group's Okta identity provider. Steadfast publishes no scopes or permissions reference page -
  this is the complete advertised scope set for the tenant's default authorization server, not a
  documented API permission model. The public Flood Risk Tracker API uses no OAuth and therefore
  has no scopes.
schemes:
