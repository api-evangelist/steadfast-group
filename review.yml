aid: steadfast-group
name: Steadfast Group
review:
  question: Does Steadfast Group expose a public, self-serve developer portal or downloadable API specification?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: broker-intermediary
  gated: true
findings:
  summary: |
    Steadfast Group Limited (ASX:SDF), the largest general insurance broker network
    and largest group of underwriting agencies in Australasia, publishes NO public
    developer portal and NO downloadable API specification. Every candidate
    developer host and path was probed and confirmed by HTTP status. All 311 URLs
    in the public sitemap were fetched and searched: zero matches for "developer
    portal", "REST API", "OpenAPI", "Swagger", "api.steadfast", "/developers",
    "AL3", or "Sunrise Exchange".

    Two integration surfaces exist and both are partner-gated. broker.steadfast.com.au
    returns HTTP 200 but redirects to /login?returnUrl=%2F and renders a page titled
    "Steadfast Broker Login" - a credentialed broker portal, not a developer portal.
    api.steadfast.com.au resolves (Azure, 40.126.241.84) and is a live IIS host, but
    returns HTTP 403 Forbidden at the root with no body other than the IIS error page,
    and HTTP 404 on /swagger, /swagger/v1/swagger.json, /api, /v1, /docs, /health and
    /index.html. It is an undocumented private/partner API host with no public
    reference material of any kind.

    The company's trading technology is the Steadfast Client Trading Platform (SCTP),
    launched 2009, which lets network brokers submit one question set to a panel of
    insurers for comparative quotes; it transacted over $1.5bn GWP in CY25 across
    9 insurer lines and 23 connected partners. SCTP and the INSIGHT cloud policy
    management platform are being consolidated into "Steadfast Apps" for end-to-end
    client, policy and claims lifecycle management. The public media release for that
    consolidation describes "an innovative configuration engine which removes the
    requirement for lengthy and costly development" - configuration, explicitly not
    a published API. Insurer/partner connectivity into SCTP is arranged commercially.

    Note on scope: Ebix Australia (ebix.com.au, operator of Sunrise Exchange, WinBEAT
    NEXT, Evolution, OneOffice) was probed and its site still self-describes as "part
    of Ebix Limited" with no Steadfast branding. Sunrise Exchange is therefore NOT
    attributed to Steadfast Group in this record.
