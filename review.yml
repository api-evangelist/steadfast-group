  subdomainEnumeration:
    method: DNS resolution of 26 candidate hostnames under steadfast.com.au on 2026-07-25
    resolved:
    - api.steadfast.com.au -> 40.126.241.84
    - broker.steadfast.com.au -> broker.steadfast.com.au.dxcloud.episerver.net
    unresolved:
    - apis, dev, developer, developers, docs, sandbox, partner, partners, portal,
      gateway, gw, integration, integrations, swagger, openapi, graphql, identity,
      auth, login, sso, id, oauth, apps, insight, sctp, quote, claims
  marketContext: |
    Australia has the legal machinery for open insurance and no live obligation.
    APRA handles prudential supervision, and the Consumer Data Right - which already
    opened banking and energy - was designated to extend to general insurance and
    then deferred and de-prioritized. There is therefore no regulatory forcing
    function that would make a broker network of this scale publish a public API,
    and Steadfast has not published one voluntarily. Its integration value sits in
    the closed SCTP insurer panel, which is a commercial network effect rather than
    an open interface.
