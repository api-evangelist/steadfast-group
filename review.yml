      ACORD: 1 page (board-and-management, the biography above)
      AL3: 0 pages
      ACORD XML: 0 pages
      NGDS: 0 pages
      Sunrise Exchange: 0 pages
      IVANS: 0 pages
  insuranceVerbs:
    quote:
      exposed: false
      note: Comparative quoting exists inside SCTP (one question set to an insurer panel)
        but is broker-facing behind the broker login; no public quote API is documented.
    bind:
      exposed: false
      note: Binding occurs in SCTP/Steadfast Apps behind the broker login; no public API.
    issue:
      exposed: false
      note: Policy issuance/administration via INSIGHT, consolidating into Steadfast Apps;
        no public API.
    fnol:
      exposed: false
      note: Claims lifecycle described as part of the Steadfast Apps end-to-end platform;
        no public FNOL API and no claims API documentation.
