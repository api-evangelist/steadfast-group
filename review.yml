  specifications:
    openapiHarvested: false
    count: 0
    note: |
      No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, or .proto artifact was found or
      saved. Probed and confirmed 404: /openapi.json, /swagger.json, /graphql,
      /llms.txt, /.well-known/security.txt, /security.txt on www.steadfast.com.au;
      /swagger/index.html, /openapi.json on api.steadfast.com.au; /swagger/index.html,
      /api on broker.steadfast.com.au. No openapi/ directory is included in this repo
      because nothing real was found.
  acord:
    posture: >-
      ACORD board leadership, no published ACORD implementation - founder/MD/CEO
      Robert B. Kelly AM is Chair of the ACORD Board in New York, but no ACORD, AL3,
      ACORD XML or NGDS technical detail appears anywhere on the public site.
    evidence:
      url: https://www.steadfast.com.au/about-us/board-and-management/
      status: 200
      quote: >-
        "Robert co-founded Steadfast and has over 52 years' experience in the insurance
        industry. Robert is a Qualified Practising Insurance Broker, a Fellow of NIBA,
        a Senior Associate of ANZIIF, a Certified Insurance Professional, a Fellow of
        the AICD and the Chair of the ACORD Board in New York."
