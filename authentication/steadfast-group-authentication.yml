observations:
  - >-
    PKCE with S256 and DPoP proof-of-possession are both advertised - a modern posture for a
    broker-network identity provider, and stronger than the estate's published documentation
    (of which there is none) would suggest.
  - >-
    The Resource Owner Password Credentials grant (`password`) and the `implicit` response types
    remain enabled. Both are discouraged by OAuth 2.1 and BCP 212; their presence is recorded as
    observed configuration, not as a recommendation.
  - >-
    `token_endpoint_auth_methods_supported` includes `none`, meaning public clients (SPA/mobile)
    are provisioned on this tenant alongside confidential clients using private_key_jwt.
  - >-
    No mutualTLS, no API-key scheme and no HTTP basic scheme is published anywhere on the
    Steadfast estate.
gaps:
  - No developer-facing authentication documentation exists on any public Steadfast property.
  - >-
    api.steadfast.com.au - the partner API host - publishes no auth metadata; /.well-known/
    returns 503 and the root returns 403, so its token model is not externally observable.
