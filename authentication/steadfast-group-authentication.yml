  note: >-
    Steadfast Group operates two very different authentication postures. The one genuinely
    public API - the Flood Risk Tracker - requires and accepts NO authentication at all. Every
    other surface (the broker portal, the partner API host, internal applications) sits behind
    an Okta-hosted OpenID Connect provider at idp.steadfast.com.au whose discovery document is
    anonymously readable, but whose client credentials are issued commercially rather than
    through self-serve signup. There is no published developer authentication guide anywhere on
    the Steadfast estate - this profile was assembled from live discovery documents and probes,
    not from documentation.
schemes:
  - name: none
    type: none
    description: >-
      The Flood Risk Tracker API accepts anonymous requests. No API key, bearer token, cookie or
      signed header was required for any observed call; sending none returned 200. Access is
      instead shaped by a restrictive CORS policy - the observed access-control-allow-origin is
      https://steadfastinsurance.wufoo.com - plus Cloudflare fronting and reCAPTCHA Enterprise
      on the human web form (the reCAPTCHA gate is enforced client-side in the tool's own
      JavaScript, not by the API).
    applies_to:
      - openapi/steadfast-group-flood-risk-tracker-openapi.yml
    sources:
      - live anonymous probes 2026-07-25
  - name: SteadfastIdP
    type: openIdConnect
    openIdConnectUrl: https://idp.steadfast.com.au/.well-known/openid-configuration
    description: >-
      Okta-hosted OpenID Connect provider (issuer https://idp.steadfast.com.au). Serves the
      credentialed broker portal at broker.steadfast.com.au and, by inference from the shared
      estate, internal and partner applications. Discovery is public; client registration is not
      self-serve in practice - the dynamic client registration endpoint exists but returned 403
      "Invalid session" to an anonymous request.
    endpoints:
      issuer: https://idp.steadfast.com.au
      authorization: https://idp.steadfast.com.au/oauth2/v1/authorize
      token: https://idp.steadfast.com.au/oauth2/v1/token
      userinfo: https://idp.steadfast.com.au/oauth2/v1/userinfo
      jwks: https://idp.steadfast.com.au/oauth2/v1/keys
      introspection: https://idp.steadfast.com.au/oauth2/v1/introspect
      revocation: https://idp.steadfast.com.au/oauth2/v1/revoke
      end_session: https://idp.steadfast.com.au/oauth2/v1/logout
      device_authorization: https://idp.steadfast.com.au/oauth2/v1/device/authorize
      registration: https://idp.steadfast.com.au/oauth2/v1/clients
