- aid: steadfast-group:identity
  name: Steadfast Identity (OpenID Connect)
  description: >-
    Steadfast Group's Okta-hosted OpenID Connect provider, issuer https://idp.steadfast.com.au.
    It fronts the credentialed broker portal used by the Steadfast Network's 414 brokerages and,
    by inference from the shared estate, internal and partner applications. The discovery
    document is anonymously readable and advertises authorization, token, userinfo, JWKS,
    introspection, revocation, device-authorization, dynamic-client-registration and logout
    endpoints, with PKCE S256 and DPoP proof-of-possession supported. Client credentials are not
    self-serve - anonymous dynamic client registration returns 403 - so this is a discoverable
    but commercially gated surface, listed because its contract is genuinely machine-readable.
  humanURL: https://broker.steadfast.com.au/
  baseURL: https://idp.steadfast.com.au
  tags:
  - Identity
  - OpenID Connect
  - OAuth 2.0
  - Single Sign-On
  - Partner Gated
