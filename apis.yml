name: Steadfast Group
kind: company
description: >-
  Steadfast Group Limited (ASX:SDF) is the largest general insurance broker network and the largest
  group of insurance underwriting agencies in Australasia, headquartered in Sydney, Australia. It is a
  broker-intermediary rather than a risk carrier: the Steadfast Network comprises 414 independent
  brokerages placing approximately $12.7 billion in gross written premium, alongside 31 underwriting
  agencies writing roughly 100 products across business pack, liability, professional indemnity, cyber,
  construction, marine, aviation, farm, strata, motor and home and contents lines, plus complementary
  businesses covering premium funding (IQumulate), life insurance, workplace risk, legal and compliance.
  Its trading technology is the Steadfast Client Trading Platform (SCTP), launched in 2009, which lets
  network brokers send one question set to a panel of insurers for instant comparative quotes and which
  transacted over $1.5 billion in GWP in CY25 across 9 insurer lines and 23 connected partners; SCTP and
  the INSIGHT policy management platform are being consolidated into a broader "Steadfast Apps" broking
  platform. API posture, recorded honestly - Steadfast Group publishes NO developer portal, NO API
  documentation and NO specification of any kind, and a full crawl of all 311 pages in the public
  sitemap returned zero references to a developer portal, REST API, OpenAPI or Swagger. Two genuinely
  machine-readable surfaces nonetheless exist and neither is announced anywhere. The consumer Flood
  Risk Tracker is backed by a public, anonymous, undocumented JSON API that resolves Australian
  addresses against the national G-NAF dataset and returns Swiss Re river-flood and storm-surge risk
  layers, returning RFC 9457 problem details and advertising api-supported-versions 1.0; the OpenAPI
  in this record was derived from the tool's own client JavaScript and from live probes. Separately,
  idp.steadfast.com.au is an Okta-hosted OpenID Connect provider publishing a complete anonymous
  discovery document with PKCE S256 and DPoP, though client registration is commercially gated. The
  commercial surfaces remain closed: broker.steadfast.com.au is a credentialed broker login wall, and
  api.steadfast.com.au and api-sf.steadfast.com.au are live but undocumented hosts returning HTTP 403
  at the root. Insurer and partner connectivity into SCTP is arranged commercially, not
  through self-serve onboarding. The company's most notable standards signal is governance rather than
  implementation: founder, Managing Director and CEO Robert B. Kelly AM is Chair of the ACORD Board in
  New York, though no ACORD, AL3, ACORD XML or NGDS implementation detail is published anywhere on the
  public site. Australia has the legal machinery for open insurance but no live obligation - the
  Consumer Data Right was designated to extend to general insurance and then deferred, so no regulatory
  forcing function pushes a broker network of this scale toward a public API.
