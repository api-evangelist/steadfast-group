apis:
- aid: steadfast-group:flood-risk-tracker
  name: Steadfast Flood Risk Tracker API
  description: >-
    The public, anonymous, read-only JSON API behind Steadfast Group's consumer Flood Risk
    Tracker tool. Two GET operations resolve a free-text Australian street address against the
    national G-NAF address dataset and then return Swiss Re natural-catastrophe risk layers for
    that address - river/fluvial flood and coastal storm surge - each with a hazard value,
    intensity, risk index and risk band. This is the only publicly reachable API surface in the
    entire Steadfast estate. Steadfast publishes no specification, no documentation and no
    support commitment for it; the OpenAPI in this repository was derived by API Evangelist from
    the tool's own client JavaScript and from live anonymous probes, and every field, status code
    and example in it was observed in a real response.
  humanURL: https://floodrisktracker.steadfast.com.au/
  baseURL: https://floodrisktracker.steadfast.com.au
  tags:
