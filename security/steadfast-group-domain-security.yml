findings:
- >-
  Email authentication is consistently strong: SPF everywhere and DMARC at p=reject on four of
  five domains - a meaningful control for a broker network exposed to invoice and premium fraud.
- >-
  DNSSEC and CAA are absent on the primary steadfast.com.au domain and on every domain except
  steadfastlife.com.au. Nothing constrains which certificate authority may issue for the
  corporate or API hosts.
- >-
  HSTS is inconsistent across the estate, ranging from ten years with includeSubDomains on the
  identity provider to entirely absent on the broker login wall and both partner API hosts.
- >-
  Two hosts still negotiate TLS 1.2 as their top protocol, including the public API host and the
  identity provider.
